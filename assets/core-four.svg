<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="160" viewBox="0 0 1000 160" role="img" aria-labelledby="t d">
  <title id="t">Python, Go, Kubernetes, Rust</title>
  <desc id="d">The four tools Bhanu reaches for: Python for product and services, Go for services and telemetry, Kubernetes for where it all runs, Rust for hot paths and tooling.</desc>
  <style>
    .name { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-anchor: middle; letter-spacing: .08em; }
    .role { font: 400 10.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; text-anchor: middle; letter-spacing: .04em; }
    .float { animation: float 5s ease-in-out infinite; }
    .pulse { animation: pulse 4.4s ease-in-out infinite; }
    .ring  { animation: ring 4.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    .accent { animation: accent 4.4s ease-in-out infinite; }
    .sweep { animation: sweep 7.5s linear infinite; }
    @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-4px) } }
    @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: .9 } }
    @keyframes ring { 0% { opacity: .8; transform: scale(.7) } 70% { opacity: 0; transform: scale(1.35) } 100% { opacity: 0; transform: scale(1.35) } }
    @keyframes accent { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
    @keyframes sweep { 0% { transform: translateX(-260px) } 60%,100% { transform: translateX(1160px) } }
    @media (prefers-reduced-motion: reduce) { .float,.pulse,.ring,.accent,.sweep { animation: none } .ring { opacity: 0 } }
  </style>
